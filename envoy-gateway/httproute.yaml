apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-social-service-route
  namespace: default
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: http
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/user-social"
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "/"
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: "X-Correlation-ID"
                value: "%REQ(x-request-id)%"
      backendRefs:
        - name: user-social-service
          port: 5000