apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-social-service-route
  namespace: default
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: http
      kind: Gateway
  # hostnames:
  #   - "onlypays.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/api/user-social"
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "/"
      backendRefs:
        - name: user-social-service
          port: 5000