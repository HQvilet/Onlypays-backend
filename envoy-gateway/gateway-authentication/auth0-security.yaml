apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: auth0-oidc-policy
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
  cors:
    allowOrigins:
      - "http://localhost:3000"
    allowCredentials: true
    allowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    allowHeaders: ["Authorization", "Content-Type"]
  # oidc:
  #   provider:
  #     issuer: "https://dev-0uo4u18ucfeprxvs.us.auth0.com"
  #   clientID: "DEldg1px98ALXG9KoSDgXAfE3hidjikc"
  #   clientSecret:
  #     name: "auth0-client-secret"
  #   # redirectURL: http://localhost:30800/oauth2/callback
  #   redirectURL: http://localhost:3000/oauth2/callback
  #   logoutPath: /logout
  #   scopes:
  #     - openid
  #     - profile
  #     - email
  jwt:
    optional: true
    providers:
    - name: auth0
      issuer: "https://dev-0uo4u18ucfeprxvs.us.auth0.com/"
      remoteJWKS:
        uri: "https://dev-0uo4u18ucfeprxvs.us.auth0.com/.well-known/jwks.json"
      claimToHeaders:
        - claim: "https://onlypays.com/app_metadata/user_id"
          header: "x-user-id"
