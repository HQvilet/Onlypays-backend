name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'payment/**'
      - 'notification/**'
      - 'user-social/**'
      - 'social-media/**'
      - 'media/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'payment/**'
      - 'notification/**'
      - 'user-social/**'
      - 'social-media/**'
      - 'media/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  changes:
    name: Detect changed backend services
    runs-on: ubuntu-latest
    outputs:
      # payment: ${{ steps.filter.outputs.payment }}
      # notification: ${{ steps.filter.outputs.notification }}
      user_social: ${{ steps.filter.outputs.user_social }}
      social_media: ${{ steps.filter.outputs.social_media }}
      # media: ${{ steps.filter.outputs.media }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: main
          filters: |
            payment:
              - 'payment/**'
            notification:
              - 'notification/**'
            user_social:
              - 'user-social/**'
            social_media:
              - 'social-media/**'
            # media:
            #   - 'media/**'

  user-social:
    name: User Social Service
    needs: changes
    if: needs.changes.outputs.user_social == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./user-social
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker compose -f docker-compose.prod.yaml build

      # - name: Testing
      #   run: docker compose -f docker-compose.prod.yaml run --rm user-social-service npm run test
  
  social-media:
    name: Social Media Service
    needs: changes
    if: needs.changes.outputs.social_media == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./social-media
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          EOF

      - name: Build Docker Image
        run: docker compose -f docker-compose.prod.yaml build

      - name: Testing
        run: docker compose run --rm test