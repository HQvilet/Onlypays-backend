services:
  development:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: media-service
    ports:
      - "4003:4003"
    environment:
      NODE_ENV: development
      PORT: 4003
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: media-service-test
    environment:
      NODE_ENV: test